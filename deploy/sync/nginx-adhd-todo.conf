# /etc/nginx/sites-available/adhd-todo, linked from sites-enabled.
# TLS from Let's Encrypt (certbot --webroot, cert name adhd-todo); both names are DNS-only records.

server {
    listen 80;
    listen [::]:80;
    server_name todo.sri-ai.xyz auth.todo.sri-ai.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# The sync server.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name todo.sri-ai.xyz;

    ssl_certificate     /etc/letsencrypt/live/adhd-todo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adhd-todo/privkey.pem;

    # A push is at most 8 MiB.
    client_max_body_size 9m;

    # Server-sent pokes: no buffering, and the stream may stay open for an hour.
    location /v1/events {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# Zitadel (its Traefik routes the API and the login UI).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name auth.todo.sri-ai.xyz;

    ssl_certificate     /etc/letsencrypt/live/adhd-todo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adhd-todo/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
    }
}
