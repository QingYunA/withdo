# /etc/nginx/sites-available/api-withdo, linked from sites-enabled.
# api.withdo.si reaches the host through the Cloudflare Tunnel `withdo` (remotely managed; see README.md), not
# through port 443: Cloudflare terminates TLS and cloudflared connects to this plain-HTTP listener
# on the same host. It listens on loopback only, so nothing else can reach it. The legacy name
# todo.sri-ai.xyz keeps its own file, nginx-adhd-todo.conf.

server {
    listen 127.0.0.1:8088;
    server_name api.withdo.si;

    # The visitor's address. Every request arrives from cloudflared on 127.0.0.1; Cloudflare puts the
    # visitor in CF-Connecting-IP. Trusting it only from loopback means a client cannot pick the
    # address, and X-Real-IP below (which PocketBase's rate limit counts per) is the visitor, not
    # 127.0.0.1.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    # A push is at most 8 MiB.
    client_max_body_size 9m;

    # Server-sent pokes: no buffering, and the stream may stay open for an hour. The server sends a
    # keepalive comment every 15 s, which keeps Cloudflare from closing the idle stream.
    location /v1/events {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # PocketBase's live updates, which the Google sign-in waits on, like /v1/events. The server pings
    # the stream every 30 s (pbauth/realtime.go) so Cloudflare, which closes a stream idle for about
    # 100 s, keeps it open.
    location /api/realtime {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # The PocketBase admin is not public on this name: its UI (/_/) and the superusers' sign-in
    # answer 404. Reach it over an SSH tunnel to the server's own port instead:
    #   ssh -N -L 18080:127.0.0.1:18080 adhd-srv
    # then open http://localhost:18080/_/.
    location /_/ {
        return 404;
    }
    location ^~ /api/collections/_superusers/ {
        return 404;
    }

    # The sync API and PocketBase's user sign-in.
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
