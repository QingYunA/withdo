# The adhd-todo sync server and its own Postgres, behind the host's nginx for api.withdo.si (through a Cloudflare Tunnel) and todo.sri-ai.xyz (legacy).
#   docker compose --env-file sync.env -f sync.compose.yml up -d
# PocketBase accounts live in ./pb_data next to this file: mkdir pb_data && chown 65532:65532 pb_data.
# bin/adhd-sync is a static linux/amd64 build: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./cmd/adhd-sync
name: adhd-sync

services:
  sync:
    image: gcr.io/distroless/static-debian12:nonroot
    restart: unless-stopped
    command:
      - /adhd-sync
      - -addr=:8080
      - -database-url=postgres://adhd_sync:${SYNC_DB_PASSWORD}@postgres:5432/adhd_sync?sslmode=disable
      - -pb-dir=/pb_data
    environment:
      # Voice input (POST /v1/transcribe). Set in sync.env; an empty MIMO_API_KEY turns voice off.
      MIMO_API_KEY: ${MIMO_API_KEY:-}
      MIMO_BASE_URL: ${MIMO_BASE_URL:-}
      VOICE_DAILY_LIMIT: ${VOICE_DAILY_LIMIT:-}
      # The official model (POST /v1/llm/chat/completions). Set in sync.env; an empty LLM_API_KEY turns it off.
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_DAILY_TURNS: ${LLM_DAILY_TURNS:-}
      LLM_DAILY_TURNS_PRO: ${LLM_DAILY_TURNS_PRO:-}
      # Withdo Pro through Waffo Pancake (M16). Set in sync.env; an empty WAFFO_KEY_FILE turns billing off.
      # WAFFO_KEY_FILE is a path inside the container, under /secrets (mounted below).
      WAFFO_MERCHANT_ID: ${WAFFO_MERCHANT_ID:-}
      WAFFO_KEY_FILE: ${WAFFO_KEY_FILE:-}
      WAFFO_STORE_ID: ${WAFFO_STORE_ID:-}
      WAFFO_PRODUCT_MONTHLY: ${WAFFO_PRODUCT_MONTHLY:-}
      WAFFO_PRODUCT_YEARLY: ${WAFFO_PRODUCT_YEARLY:-}
      WAFFO_MODE: ${WAFFO_MODE:-}
      # PayPal as a second way to pay (M17), on top of Waffo. An empty PAYPAL_CREDENTIALS_FILE (a path
      # inside the container, under /secrets) turns it off.
      PAYPAL_CREDENTIALS_FILE: ${PAYPAL_CREDENTIALS_FILE:-}
      PAYPAL_ENV: ${PAYPAL_ENV:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYPAL_PLAN_MONTHLY: ${PAYPAL_PLAN_MONTHLY:-}
      PAYPAL_PLAN_MONTHLY_TRIAL: ${PAYPAL_PLAN_MONTHLY_TRIAL:-}
      PAYPAL_PLAN_YEARLY: ${PAYPAL_PLAN_YEARLY:-}
      PAYPAL_PLAN_YEARLY_TRIAL: ${PAYPAL_PLAN_YEARLY_TRIAL:-}
    volumes:
      - ./bin/adhd-sync:/adhd-sync:ro
      # PocketBase's data (its users and passwords); a host directory owned by uid 65532.
      - ./pb_data:/pb_data
      # Waffo's API key (a PKCS#8 PEM) and PayPal's credentials (a JSON file), readable by uid 65532, read-only:
      # /opt/adhd-todo/sync/secrets/waffo-test.pem is /secrets/waffo-test.pem.
      - /opt/adhd-todo/sync/secrets:/secrets:ro
    ports:
      - 127.0.0.1:18080:8080
    networks:
      - sync
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: adhd_sync
      POSTGRES_PASSWORD: ${SYNC_DB_PASSWORD}
      POSTGRES_DB: adhd_sync
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - sync
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adhd_sync -d adhd_sync"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  sync:

volumes:
  postgres-data:
