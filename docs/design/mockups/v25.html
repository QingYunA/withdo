<h1>v25 · 最近变化（#110）<button id="mode">切到深色</button></h1>
<p class="lead">这个页面回答「我的项目最近变了什么」，不是「谁在等我审」。默认关闭，在 设置 › 通用 打开后侧边栏才有这一行。按项目分节；每节顶上是助手写的两三句话，下面是合并的 PR，按新功能、修复、其他分类，每条一句人话；还开着的 PR 和这段时间的 issue 也在这一节里。看不懂哪条，点开让助手讲讲。审查、检查、指派都不在这里，那是 Agent 的事。之前一版按审查状态分组，已作废。</p>
