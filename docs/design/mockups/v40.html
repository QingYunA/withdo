<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><title>v40 Withdo 图标细化</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e8e8ec;font-family:-apple-system,"PingFang SC","Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#1c2024;padding:48px;width:1400px}
.pt{font-size:22px;line-height:28px;font-weight:600}.pn{font-size:15px;line-height:22px;color:#60646c;margin-top:6px;max-width:1200px}
.sec{font-size:17px;font-weight:600;margin:40px 0 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:16px}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 0 0 .5px rgba(0,0,0,.12)}
.card h3{font-size:15px;font-weight:600;margin-top:14px}.card p{font-size:13px;line-height:18px;color:#60646c;margin-top:4px}
.sizes{display:flex;align-items:flex-end;gap:12px;margin-top:14px}
canvas{display:block;image-rendering:pixelated}
.dock{display:flex;align-items:flex-end;gap:10px;padding:8px 10px;border-radius:22px;margin-top:16px;width:max-content}
.dock.l{background:rgba(246,246,246,.85);box-shadow:0 0 0 .5px rgba(0,0,0,.15)}.dock.d{background:rgba(40,40,44,.9);box-shadow:0 0 0 .5px rgba(255,255,255,.12)}
.dk i{display:block;width:64px;height:64px;border-radius:14px}
.ctx{display:flex;gap:32px;flex-wrap:wrap;margin-top:16px;align-items:flex-start}
.ctx .lab{font-size:13px;color:#60646c;margin-top:8px}
.menubar{height:24px;display:flex;align-items:center;gap:14px;padding:0 12px;font-size:13px;width:420px;justify-content:flex-end}
.menubar.l{background:#ececec;color:#1c2024}.menubar.d{background:#1f1f22;color:#edeef0}
.task{height:48px;display:flex;align-items:center;gap:4px;padding:0 12px;width:420px;justify-content:center}
.task.l{background:#eef0f4}.task.d{background:#1c1c1c}
.task .slot{width:40px;height:40px;border-radius:4px;display:grid;place-items:center}.task .slot.on{background:rgba(127,127,127,.18)}
.task .slot i{display:block;width:24px;height:24px;border-radius:5px;background:#9aa0aa}
</style></head><body>
<div class="pt">v40 · Withdo 图标细化：深蓝底 W2</div>
<div class="pn">一个对勾：iris 短笔是人，白色长笔是 Agent，拐角归白色（事情由 Agent 收尾）。比较网格和笔画粗细，每版按外框自动居中，再放进 Dock、菜单栏和 Windows 任务栏看。</div>
<div class="sec">1 · 网格与粗细</div><div class="grid" id="g"></div>
<div class="sec">2 · 放进系统里（用第 1 节的 C 版）</div><div class="ctx" id="ctx"></div>
<script>
const P={'.':null,i:'#B1A9FF',I:'#5B5BD6',w:'#F8FAFC',v:'#C9CDD6'};
const BG='#1E293B';
// A check with a square brush t cells wide: short arm a steps down-right, long arm b steps up-right.
// The bounding box is centred on the grid; the vertex belongs to the long arm.
function check(n,t,a,b,short,long){const g=Array.from({length:n},()=>Array(n).fill('.'));
 const w=a+b+t,h=b+t,x0=Math.floor((n-w)/2),vy=Math.floor((n-h)/2)+b,vx=x0+a;
 const sq=(x,y,c)=>{for(let dy=0;dy<t;dy++)for(let dx=0;dx<t;dx++){const X=x+dx,Y=y+dy;if(g[Y]&&X>=0&&X<n)g[Y][X]=c}};
 for(let s=0;s<a;s++)sq(x0+s,vy-a+s,short);
 for(let s=0;s<=b;s++)sq(vx+s,vy-s,long);
 return g.map(r=>r.join(''))}
const V=[
 ['A','16 格 · 2 格粗','v39 的线宽，居中后。最细，32px 以下还清楚，大图偏单薄。',check(16,2,3,7,'i','w')],
 ['B','16 格 · 3 格粗','加粗一格。大图有分量，16px 时拐角开始挤。',check(16,3,3,7,'i','w')],
 ['C','24 格 · 3 格粗','更细的网格，同样的像素感但阶梯更密。和 Summary 场景的 24 格角色一致。',check(24,3,5,11,'i','w')],
 ['D','24 格 · 4 格粗','C 再加粗。最接近旧图标对勾的分量。',check(24,4,5,10,'i','w')]];
function icon(rows,size){const n=rows.length,cv=document.createElement('canvas');cv.width=cv.height=size;const x=cv.getContext('2d');
 x.fillStyle=BG;x.beginPath();x.roundRect(0,0,size,size,size*0.225);x.fill();
 const pad=Math.round(size*0.12),cell=(size-pad*2)/n;
 rows.forEach((r,j)=>[...r].forEach((ch,i)=>{const c=P[ch];if(!c)return;x.fillStyle=c;
  x.fillRect(Math.round(pad+i*cell),Math.round(pad+j*cell),Math.round(pad+(i+1)*cell)-Math.round(pad+i*cell),Math.round(pad+(j+1)*cell)-Math.round(pad+j*cell))}));
 cv.style.width=cv.style.height=size+'px';return cv}
const g=document.getElementById('g');
for(const [k,t,p,rows] of V){const c=document.createElement('div');c.className='card';c.appendChild(icon(rows,256));
 const s=document.createElement('div');s.className='sizes';[64,32,16].forEach(z=>s.appendChild(icon(rows,z)));c.appendChild(s);
 const h=document.createElement('h3');h.textContent=k+' · '+t;c.appendChild(h);const q=document.createElement('p');q.textContent=p;c.appendChild(q);g.appendChild(c)}
// menu bar template: 12 x 12, 2 cells thick, drawn 18 pt
const M=check(12,2,2,5,'#','#');
function tmpl(px,col){const cv=document.createElement('canvas');cv.width=cv.height=12*px;const x=cv.getContext('2d');x.fillStyle=col;
 M.forEach((r,j)=>[...r].forEach((ch,i)=>{if(ch==='#')x.fillRect(i*px,j*px,px,px)}));cv.style.width=cv.style.height=(12*px*0.75)+'px';return cv}
const ctx=document.getElementById('ctx');const pick=V[2][3];
function block(el,lab){const w=document.createElement('div');w.appendChild(el);const l=document.createElement('div');l.className='lab';l.textContent=lab;w.appendChild(l);ctx.appendChild(w)}
for(const mode of ['l','d']){const d=document.createElement('div');d.className='dock '+mode;
 ['#3b82f6','#f2f2f2','#ff9f0a','#34c759'].forEach(c=>{const s=document.createElement('div');s.className='dk';const i=document.createElement('i');i.style.background=c;s.appendChild(i);d.appendChild(s)});
 const me=document.createElement('div');me.className='dk';me.appendChild(icon(pick,64));d.insertBefore(me,d.children[2]);
 block(d,mode==='l'?'macOS Dock · 浅色':'macOS Dock · 深色')}
for(const mode of ['l','d']){const b=document.createElement('div');b.className='menubar '+mode;b.appendChild(tmpl(3,mode==='l'?'#1c2024':'#edeef0'));
 ['Wi-Fi','100%','周一 09:41'].forEach(t=>{const s=document.createElement('span');s.textContent=t;b.appendChild(s)});
 block(b,mode==='l'?'菜单栏 · 浅色（12 格模板图，18 pt）':'菜单栏 · 深色')}
for(const mode of ['l','d']){const b=document.createElement('div');b.className='task '+mode;
 for(let k=0;k<5;k++){const s=document.createElement('div');s.className='slot'+(k===2?' on':'');s.appendChild(k===2?icon(pick,24):document.createElement('i'));b.appendChild(s)}
 block(b,mode==='l'?'Windows 任务栏 · 浅色（24 px）':'Windows 任务栏 · 深色')}
</script></body></html>
