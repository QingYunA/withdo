<style>

<script>
const S = {

const P = (d, s = 14, c = 'currentColor') => `<svg class="px" width="${s}" height="${s}" viewBox="0 0 24 24" fill="${c}"><path d="${d}"/></svg>`;
const I = {

const side = () => `<div class="side">

  ${grp('等人审', 2)}${prRow({ st: 'open', t: 'Bump the MCP server to 0.5', repo: 'adhd-todo', n: 40, who: 'crab', whoName: 'Claude Code', ck: 'wait', tm: '20 分钟' })}

document.getElementById('a2').innerHTML = `<div class="win">${side()}<div class="main">${head('pr', 9, 4)}
